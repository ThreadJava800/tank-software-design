def junit = [:]
junit.jupiter_api = "org.junit.jupiter:junit-jupiter-api:$versions.junit"
junit.jupiter_engine = "org.junit.jupiter:junit-jupiter-engine:$versions.junit"
deps.junit = junit

ext.deps = deps
